name: erp-scolaire

services:
  web:
    # 1. Utilise la variable APP_IMAGE (envoyée par GitHub) sinon l'image locale
    image: ${APP_IMAGE:-erp-scolaire:local}
    # 2. Empêche Docker d'essayer de télécharger l'image locale depuis Docker Hub
    pull_policy: never
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # 3. Le healthcheck DOIT suivre la redirection 301 avec -L
    healthcheck:
      test: ["CMD", "curl", "-fL", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: