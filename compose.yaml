name: erp-scolaire

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-school}"
      POSTGRES_USER: "${POSTGRES_USER:-school}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: "${APP_IMAGE:-erp-scolaire:local}"
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Définir DJANGO_SECRET_KEY dans .env}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_SECURE_SSL: "${DJANGO_SECURE_SSL:-0}"
      POSTGRES_DB: "${POSTGRES_DB:-school}"
      POSTGRES_USER: "${POSTGRES_USER:-school}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"
    healthcheck:
      # CORRECTION ICI : Utilisation de curl avec -fL
      test: ["CMD", "curl", "-fL", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  backend: