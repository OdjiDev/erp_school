name: Publication et déploiement

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests Django (PostgreSQL)
    uses: ./.github/workflows/tests.yml

  build:
    name: Publier l'image GHCR
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Calculer le nom de l'image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Définir les métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Déployer en production
    runs-on: ubuntu-latest
    needs: build
    # ATTENTION : Assurez-vous d'avoir une variable DEPLOY_ENABLED=true
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' 
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          # ON UTILISE VOS NOMS DE SECRETS ICI
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copier la configuration Compose
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          set -euo pipefail
          scp compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.yaml"

      - name: Tirer l'image et redémarrer
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ needs.build.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' APP_IMAGE='$APP_IMAGE' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export APP_IMAGE
          docker compose pull web
          docker compose up -d --no-build --remove-orphans --wait
          docker image prune -f
          REMOTE