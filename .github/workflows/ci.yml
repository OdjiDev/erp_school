name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Django (PostgreSQL)
    uses: ./.github/workflows/tests.yml

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le script d'entrée et Compose
        run: |
          sh -n docker/entrypoint.sh
          docker compose --env-file .env.docker.example config --quiet

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: erp-scolaire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: |
          docker run -d --name erp-ci \
            -p 8000:8000 \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci-only-secret-key-for-container \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            erp-scolaire:ci

      - name: Vérifier la santé et les fichiers statiques
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/; then
              curl --fail --silent --show-error --output /dev/null \
                http://127.0.0.1:8000/static/css/app.css
              curl --fail --silent --show-error --output /dev/null \
                http://127.0.0.1:8000/connexion/
              echo "Conteneur opérationnel."
              exit 0
            fi
            sleep 2
          done
          docker logs erp-ci
          exit 1

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f erp-ci
