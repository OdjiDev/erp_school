{% extends "base.html" %}

{% block title %}Accès non autorisé — Gestion scolaire{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Accès non autorisé</h1>
    <p class="muted">
      Votre compte n'est rattaché à aucun établissement actif.
      Contactez l'administrateur de votre organisation.
    </p>
    <form method="post" action="{% url 'school:logout' %}" style="margin-top: 1.5rem;">
      {% csrf_token %}
      <button class="btn" type="submit">Se déconnecter</button>
    </form>
  </div>
</div>
{% endblock %}
